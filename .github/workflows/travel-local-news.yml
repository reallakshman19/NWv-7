name: Travel local news prefetch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/travel-local-news.yml'
      - 'scripts/collect_travel_local_news.mjs'
      - 'scripts/validate_travel_local_news.mjs'
      - 'src/services/travelRssParser.js'
      - 'src/services/storyLocationPriority.js'
      - 'src/services/travelNewsFreshness.js'
      - 'src/services/travelNewsQueries.js'
  schedule:
    - cron: '13 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: travel-local-news-prefetch
  cancel-in-progress: false

jobs:
  collect:
    name: Refresh four city-specific RSS feeds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect dated, city-verified news
        shell: bash
        run: |
          set -euo pipefail
          for city in chennai trichy muscat colombo; do
            TRAVEL_LOCATION_KEY="$city" node scripts/collect_travel_local_news.mjs
          done

      - name: Regenerate published source-policy documents
        run: node scripts/generate_travel_source_policy.mjs

      - name: Validate freshness, source custody and retention
        run: node scripts/validate_travel_local_news.mjs

      - name: Run Travel Local regressions
        run: |
          npx vitest run --config vitest.config.js \
            src/services/travelFeedFreshness.cert.test.js \
            src/services/travelNewsIngestion.cert.test.js \
            src/services/travelNewsWorkflow.cert.test.js

      - name: Publish current city snapshots to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/travel-local-*.json public/data/travel-source-policy*.json
          if git diff --cached --quiet; then
            echo "No travel-local changes to publish"
            exit 0
          fi
          git commit -m "data(travel): refresh city news within 36-hour retention"
          git pull --rebase origin main
          git push origin HEAD:main
