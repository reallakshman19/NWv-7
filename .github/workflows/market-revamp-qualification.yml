name: Market Revamp Branch Qualification

on:
  push:
    branches:
      - fix/market-row-retention-20261119
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/market-revamp-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: market-revamp-branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install packages
        id: install
        run: npm ci
      - name: Install publisher test dependencies
        run: python -m pip install --disable-pip-version-check pytest requests beautifulsoup4
      - name: Deterministic market policies
        if: steps.install.outcome == 'success'
        run: |
          node --test scripts/test_market_quote_policy.mjs scripts/test_market_service_integration.mjs scripts/test_market_equity_policy.mjs scripts/test_market_equity_service.mjs scripts/test_market_workspace_route.mjs scripts/test_market_fund_requests.mjs scripts/test_market_json_request.mjs scripts/test_market_settings_migration.mjs
      - name: Publisher regression
        run: python -m pytest -q scripts/test_refresh_india_market.py
      - name: Market Vitest certification
        if: steps.install.outcome == 'success'
        run: npx vitest run --config vitest.config.js src/pages/MarketPage.workspaces.cert.test.jsx src/pages/MarketPage.partialFeed.cert.test.jsx src/pages/MarketPage.release6J.cert.test.jsx src/components/market/IndiaMarketTools.cert.test.jsx src/services/indiaMarketTools.cert.test.js src/services/indianMarketStableService.cert.test.js src/context/MarketContext.cert.test.jsx src/services/marketTrust.delivery.cert.test.js
      - name: Full Vitest regression
        if: always() && steps.install.outcome == 'success'
        run: npm run test:unit
      - name: ESLint
        if: always() && steps.install.outcome == 'success'
        run: npm run lint
      - name: Production Vite build (no deployment)
        if: always() && steps.install.outcome == 'success'
        run: npm run build
      - name: Publish branch-only certification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          JOB_OUTCOME: ${{ job.status }}
          ACTIONS_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo, sha = os.environ['REPOSITORY'], os.environ['HEAD_SHA']
          passed = os.environ['JOB_OUTCOME'] == 'success'
          body = {
              'state': 'success' if passed else 'failure',
              'context': 'market-revamp/branch-qualification',
              'description': 'Full branch tests, lint and build passed' if passed else 'Branch qualification failed; inspect the workflow run',
              'target_url': f"https://github.com/{repo}/actions/runs/{os.environ['ACTIONS_RUN_ID']}",
          }
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/statuses/{sha}',
              data=json.dumps(body).encode(),
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
              },
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=10) as response:
              print('Published branch-only commit status', response.status, body['state'])
          PY
