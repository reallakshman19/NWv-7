name: Market Revamp Branch Qualification

on:
  push:
    branches:
      - fix/market-row-retention-20261119
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/market-revamp-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-revamp-branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install packages
        run: npm ci
      - name: Install publisher test dependencies
        run: python -m pip install --disable-pip-version-check pytest requests beautifulsoup4
      - name: Deterministic market policies
        run: |
          node --test scripts/test_market_quote_policy.mjs scripts/test_market_service_integration.mjs scripts/test_market_equity_policy.mjs scripts/test_market_equity_service.mjs scripts/test_market_workspace_route.mjs scripts/test_market_fund_requests.mjs scripts/test_market_json_request.mjs
      - name: Publisher regression
        run: python -m pytest -q scripts/test_refresh_india_market.py
      - name: Market Vitest certification
        run: npx vitest run --config vitest.config.js src/pages/MarketPage.workspaces.cert.test.jsx src/pages/MarketPage.partialFeed.cert.test.jsx src/pages/MarketPage.release6J.cert.test.jsx src/components/market/IndiaMarketTools.cert.test.jsx src/services/indiaMarketTools.cert.test.js src/services/indianMarketStableService.cert.test.js src/context/MarketContext.cert.test.jsx src/services/marketTrust.delivery.cert.test.js
      - name: Full Vitest regression
        if: success()
        run: npm run test:unit
      - name: ESLint
        if: success()
        run: npm run lint
      - name: Production Vite build (no deployment)
        if: success()
        run: npm run build
