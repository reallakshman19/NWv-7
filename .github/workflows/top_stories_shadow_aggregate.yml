name: Top Stories Shadow Aggregate

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      report_date:
        description: UTC report date in YYYY-MM-DD; defaults to previous UTC day
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve study and report date
        id: context
        shell: bash
        run: |
          STUDY_ID=$(node -p "require('./config/top_stories_shadow_study.json').studyId")
          REPORT_DATE='${{ inputs.report_date }}'
          if [ -z "$REPORT_DATE" ]; then
            REPORT_DATE=$(date -u -d 'yesterday' +%F)
          fi
          if ! [[ "$REPORT_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid report date: $REPORT_DATE" >&2
            exit 1
          fi
          echo "study_id=$STUDY_ID" >> "$GITHUB_OUTPUT"
          echo "report_date=$REPORT_DATE" >> "$GITHUB_OUTPUT"

      - name: Download shadow observation artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/download_top_stories_shadow_artifacts.mjs \
            --output .shadow-downloads \
            --repository '${{ github.repository }}' \
            --workflow top_stories_shadow.yml \
            --study-id '${{ steps.context.outputs.study_id }}' \
            --date '${{ steps.context.outputs.report_date }}'

      - name: Extract observation artifacts
        shell: bash
        run: |
          mkdir -p .shadow-observations
          shopt -s nullglob
          for archive in .shadow-downloads/*.zip; do
            name=$(basename "$archive" .zip)
            mkdir -p ".shadow-observations/$name"
            unzip -q "$archive" -d ".shadow-observations/$name"
          done

      - name: Aggregate daily stability evidence
        run: |
          node scripts/aggregate_top_stories_shadow.mjs \
            --input .shadow-observations \
            --output .shadow-report \
            --config config/top_stories_shadow_study.json \
            --date '${{ steps.context.outputs.report_date }}'

      - name: Include acquisition manifest
        if: always()
        shell: bash
        run: |
          mkdir -p .shadow-report
          if [ -f .shadow-downloads/download_manifest.json ]; then
            cp .shadow-downloads/download_manifest.json .shadow-report/download_manifest.json
          fi

      - name: Upload daily report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top-stories-shadow-daily-${{ steps.context.outputs.study_id }}-${{ steps.context.outputs.report_date }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .shadow-report/
          if-no-files-found: error
          retention-days: 30
