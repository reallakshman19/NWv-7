name: Insight Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '27 */3 * * *'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/insight_refresh.yml'
      - 'config/insight_sources.json'
      - 'scripts/*insight*'

permissions:
  contents: read

concurrency:
  group: insight-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded publisher dependencies
        run: python -m pip install --disable-pip-version-check requests feedparser pytest
      - name: Verify genuine dates, source identities, retention and failed-acquisition guards
        run: python -m pytest scripts/test_insight_acquisition.py scripts/test_validate_insight_prefetch_output.py scripts/test_insight_collector_json_contract.py scripts/test_insight_source_policy.py scripts/test_insight_adaptive_source_health.py scripts/test_section_source_policy.py -q

  refresh:
    needs: certify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check requests feedparser
      - name: Acquire free publisher RSS once per URL and retain 36 hours of genuine publication history
        run: python scripts/fetch_insight_stories.py
      - name: Reject stale, undated, empty or failed acquisition output
        run: python scripts/validate_insight_prefetch_output.py --require-acquisition
      - name: Commit only the qualified Insight publication and bounded seven-day archives
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/newsdata/insight_latest.json public/newsdata/insight_quality_report.json public/newsdata/insight_quality_summary.md public/newsdata/insight_source_health.json public/newsdata/insight_source_policy_report.json
          git add -A -- 'public/newsdata/insight_20*.json'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(insight): refresh source-dated 36-hour evidence [skip ci]"
          # A concurrent main update fails safely; never overwrite newer data.
          git push origin HEAD:main
      - name: Preserve native acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: insight-publication-${{ github.run_id }}
          path: |
            public/newsdata/insight_latest.json
            public/newsdata/insight_quality_report.json
            public/newsdata/insight_quality_summary.md
            public/newsdata/insight_source_health.json
            public/newsdata/insight_source_policy_report.json
          retention-days: 7
