name: Sections Cloudflare Preview Mirror

# Data-only mirror. Not a Pages deployment or Cloudflare authority promotion.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sections_cloudflare_mirror.yml'
      - 'scripts/mirror_cloudflare_sections.py'
      - 'scripts/test_mirror_cloudflare_sections.py'
  workflow_dispatch:
  schedule:
    # Independent of the Cloudflare cron; allow the committed epoch to settle.
    - cron: '42 */3 * * *'

permissions:
  contents: read

concurrency:
  group: sections-cloudflare-mirror-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    name: Fail-closed mirror contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify committed epochs, hashes, stale rejection and rollback
        run: python -m unittest scripts/test_mirror_cloudflare_sections.py -v

  mirror:
    name: Record independently verified Cloudflare preview
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: certify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read Cloudflare verified SHADOW_COMMITTED public preview
        run: python scripts/mirror_cloudflare_sections.py
      - name: Commit only the paired immutable-evidence mirror files
        run: |
          set -euo pipefail
          test -s public/newsdata/sections_cloudflare_latest.json
          test -s public/newsdata/sections_cloudflare_manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/newsdata/sections_cloudflare_latest.json public/newsdata/sections_cloudflare_manifest.json
          if git diff --cached --quiet; then
            echo "Unchanged committed epoch; nothing to publish."
            exit 0
          fi
          git commit -m "data(sections): mirror verified Cloudflare shadow preview [skip ci]"
          # Never force-push or auto-publish Pages. Concurrent main change fails closed.
          git push origin HEAD:main
      - name: Preserve mirror validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sections-cloudflare-mirror-${{ github.run_id }}
          path: |
            public/newsdata/sections_cloudflare_latest.json
            public/newsdata/sections_cloudflare_manifest.json
          if-no-files-found: warn
          retention-days: 7
