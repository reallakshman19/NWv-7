name: Up Ahead Retention V2 — Contract Tests

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/upahead_retention_v2.yml'
      - 'config/upahead_retention_policy.json'
      - 'scripts/enrich_upahead_contract.py'
      - 'scripts/fetch_upahead_events.py'
      - 'scripts/horizon_policy.py'
      - 'scripts/content_lifecycle.py'
      - 'scripts/validate_upahead_prefetch_output.py'
      - 'scripts/test_upahead_retention*'
      - 'scripts/test_upahead_lifecycle_contract.py'
      - 'scripts/test_horizon_constants_match_static.mjs'
      - 'src/config/horizonPolicy.js'
      - 'src/services/upAheadLifecycle.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Fixed-clock lifecycle and hard-cap parity
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest requests feedparser
      - name: Test expiry, future pending, caps, storage, cancellation and recovery
        run: |
          python -m pytest -q scripts/test_7day_horizon_contract.py scripts/test_content_lifecycle.py scripts/test_upahead_lifecycle_contract.py scripts/test_upahead_retention.py scripts/test_upahead_retention_v2.py scripts/test_upahead_recovery.py
      - name: Prove Python, JavaScript and JSON policy parity
        run: node scripts/test_horizon_constants_match_static.mjs
      - name: Prove browser lifecycle expiry parity
        run: node scripts/test_upahead_retention_v2_browser.mjs
