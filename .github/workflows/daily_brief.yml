name: Daily News Brief

on:
  workflow_dispatch:
  schedule:
    - cron: '20 0,6,12,18 * * *'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/daily_brief.yml'
      - 'scripts/daily_brief.py'
      - 'scripts/test_daily_brief.py'

permissions:
  contents: read

concurrency:
  group: newspaper-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests feedparser pytest
      - run: python -m pytest scripts/test_daily_brief.py -q
  refresh:
    needs: certify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests feedparser
      - name: Publish only source-dated publisher headlines
        run: python scripts/daily_brief.py
      - name: Commit current publication
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/data/epaper_data.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(newspaper): refresh current publisher headlines [skip ci]"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newspaper-publication-${{ github.run_id }}
          path: public/data/epaper_data.json
          retention-days: 7
