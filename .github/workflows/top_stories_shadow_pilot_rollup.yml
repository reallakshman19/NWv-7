name: Top Stories Shadow Pilot Rollup

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      start_date:
        description: First UTC day, YYYY-MM-DD
        required: false
        type: string
      end_date:
        description: Last UTC day, YYYY-MM-DD
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  rollup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Resolve date range
        id: range
        shell: bash
        run: |
          END_DATE='${{ inputs.end_date }}'
          START_DATE='${{ inputs.start_date }}'
          [ -n "$END_DATE" ] || END_DATE=$(date -u -d 'yesterday' +%F)
          [ -n "$START_DATE" ] || START_DATE=$(date -u -d "$END_DATE -6 days" +%F)
          echo "start_date=$START_DATE" >> "$GITHUB_OUTPUT"
          echo "end_date=$END_DATE" >> "$GITHUB_OUTPUT"

      - name: Download aggregate artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p .pilot-input/aggregate
          gh run list --workflow top_stories_shadow_aggregate.yml --status completed --limit 30 \
            --json databaseId,conclusion --jq '.[] | select(.conclusion == "success") | .databaseId' |
          while read -r run_id; do
            [ -n "$run_id" ] || continue
            mkdir -p ".pilot-input/aggregate/$run_id"
            gh run download "$run_id" --dir ".pilot-input/aggregate/$run_id" || true
          done

      - name: Download validation artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p .pilot-input/validation
          gh run list --workflow top_stories_shadow_validate_24h.yml --status completed --limit 30 \
            --json databaseId,conclusion --jq '.[] | select(.conclusion == "success") | .databaseId' |
          while read -r run_id; do
            [ -n "$run_id" ] || continue
            mkdir -p ".pilot-input/validation/$run_id"
            gh run download "$run_id" --dir ".pilot-input/validation/$run_id" || true
          done

      - name: Build expert decision pack
        run: |
          node scripts/build_top_stories_pilot_rollup.mjs \
            --input .pilot-input \
            --output .pilot-output \
            --config config/top_stories_shadow_study.json \
            --start-date '${{ steps.range.outputs.start_date }}' \
            --end-date '${{ steps.range.outputs.end_date }}'

      - name: Upload decision pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top-stories-shadow-pilot-${{ steps.range.outputs.start_date }}-to-${{ steps.range.outputs.end_date }}-${{ github.run_id }}
          path: .pilot-output/
          if-no-files-found: error
          retention-days: 30
