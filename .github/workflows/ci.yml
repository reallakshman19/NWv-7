name: CI Validation Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, unit tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Block rejected patch artifacts
        shell: bash
        run: |
          set -o pipefail
          artifacts="$(find . -type f \( -name '*.rej' -o -name '*.orig' \) -print)"
          if [ -n "$artifacts" ]; then
            echo "Rejected patch or backup artifacts were found:"
            printf '%s\n' "$artifacts"
            exit 1
          fi

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run smoke certification
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          npm run test:certify:smoke 2>&1 | tee reports/ci_validation.log

      - name: Market R2.1 domain and integration certification
        shell: bash
        run: |
          set -o pipefail
          node --test scripts/test_market_r21_contracts.mjs scripts/test_market_r21_wp*.mjs

      - name: UpAhead v2 source and Cloudflare parity
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_upahead_*_v2_shadow.py' -v
          node --test scripts/test_upahead_generation_v2_parity.mjs cloudflare/upahead-dataset-api/src/identityV2Shadow.test.mjs cloudflare/upahead-dataset-api/src/edgeV2Probe.test.mjs

      - name: Validate PR evidence contract
        if: github.event_name == 'pull_request'
        run: node scripts/validate_pr_evidence.mjs

      - name: Upload verified Vite build
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: verified-vite-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Upload failure log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ci-validation-failure-log
          path: reports/ci_validation.log
          if-no-files-found: ignore


  weather-browser:
    name: Citywise Weather browser acceptance
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test citywise Weather and Quick Weather in Chromium
        run: node scripts/test_weather_citywise_e2e.mjs
      - name: Upload desktop and mobile Weather UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weather-compact-ui-screenshots
          path: artifacts/weather-ui-compact/
          if-no-files-found: warn
          retention-days: 14
