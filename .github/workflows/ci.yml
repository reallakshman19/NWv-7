name: CI Validation Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, unit tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Block rejected patch artifacts
        shell: bash
        run: |
          set -o pipefail
          artifacts="$(find . -type f \( -name '*.rej' -o -name '*.orig' \) -print)"
          if [ -n "$artifacts" ]; then
            echo "Rejected patch or backup artifacts were found:"
            printf '%s\n' "$artifacts"
            exit 1
          fi

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run smoke certification
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          npm run test:certify:smoke 2>&1 | tee reports/ci_validation.log

      - name: Market R2.1 domain and integration certification
        shell: bash
        run: |
          set -o pipefail
          node --test scripts/test_market_r21_contracts.mjs scripts/test_market_r21_wp*.mjs
          SNAPSHOT_FRESHNESS_FILES=market_snapshot.json,mutual_fund_snapshot.json node scripts/test_public_snapshot_freshness_static.mjs
          node scripts/test_market_snapshot_integrity.mjs
          node scripts/check_market_publication_assets.mjs public docs dist
          node --test scripts/test_market_r3d_publication_contract.mjs

      - name: UpAhead v2 source and Cloudflare parity
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_upahead_*_v2_shadow.py' -v
          # Freeze the historical 98+11 snapshot from Git history, not today's moving output.
          # The source SHA-256 and Git blob must BOTH match before any replay.
          python3 scripts/audit_upahead_v2_source_snapshot.py --from-pinned-git-blob --expected-sha256 7bb3d491cf4df3c8ef1f57c479655e3e58141a5cd7bd95012bfc6b70f6d2d2f3 --expected-git-blob 7642efed72b6e733c7f9e5891c6a644317f71d16 --source-commit c9c5420bdaa31fb5e91c4940d7af9b0b01347a82

          node --test scripts/test_upahead_generation_v2_parity.mjs cloudflare/upahead-dataset-api/src/identityV2Shadow.test.mjs

      - name: Validate PR evidence contract
        if: github.event_name == 'pull_request'
        run: node scripts/validate_pr_evidence.mjs

      - name: Upload verified Vite build
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: verified-vite-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Upload failure log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ci-validation-failure-log
          path: reports/ci_validation.log
          if-no-files-found: ignore


  weather-browser:
    name: Citywise Weather browser acceptance
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test citywise Weather and Quick Weather in Chromium
        run: node scripts/test_weather_citywise_e2e.mjs
      - name: Upload desktop and mobile Weather UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weather-compact-ui-screenshots
          path: artifacts/weather-ui-compact/
          if-no-files-found: warn
          retention-days: 14
