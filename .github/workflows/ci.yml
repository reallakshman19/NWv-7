name: CI Validation Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, unit tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2  # retain the parent for exact PR-merge diff checks

      - name: Block rejected patch artifacts
        shell: bash
        run: |
          set -o pipefail
          artifacts="$(find . -type f \( -name '*.rej' -o -name '*.orig' \) -print)"
          if [ -n "$artifacts" ]; then
            echo "Rejected patch or backup artifacts were found:"
            printf '%s\n' "$artifacts"
            exit 1
          fi

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run smoke certification
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          npm run test:certify:smoke 2>&1 | tee reports/ci_validation.log

      - name: Run editorial certification for ranking or source-policy changes
        shell: bash
        run: |
          set -euo pipefail
          changed_files="$(git diff --name-only HEAD^1 HEAD)"
          printf 'Files changed in current commit or PR merge:\n%s\n' "$changed_files"
          if printf '%s\n' "$changed_files" | grep -Eq '^(src/services/topStories/|src/data/datasets/sectionsDataset\.|src/services/rssAggregator\.js$|scripts/sections-live/|scripts/top-stories-shadow/|cloudflare/sections-shadow/)'; then
            mkdir -p reports
            npm run test:certify:editorial 2>&1 | tee reports/ci_editorial.log
          else
            echo 'No ranking / source-policy files changed; editorial certification not required for this diff.'
          fi

      - name: Upload verified Vite build
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: verified-vite-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Upload failure log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ci-validation-failure-log
          path: |
            reports/ci_validation.log
            reports/ci_editorial.log
          if-no-files-found: ignore

