name: Market Refresh

on:
  workflow_dispatch:
  schedule:
    # India: 09:30 / 13:30 / 16:30 weekdays; one weekend daily-close refresh.
    - cron: '0 4,8,11 * * 1-5'
    - cron: '0 4 * * 0,6'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/market_refresh.yml'
      - 'scripts/refresh_india_market.py'
      - 'scripts/test_refresh_india_market.py'

permissions:
  contents: read
concurrency:
  group: market-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pytest
      - run: python -m pytest scripts/test_refresh_india_market.py -q
  refresh:
    needs: certify
    # Default OFF. Opt-in requires a separately reviewed licensed-source and Owner release decision.
    # This branch does not alter the currently deployed main workflow.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.MARKET_LICENSED_PUBLICATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Acquire source-dated India daily data (25 bounded requests)
        run: python scripts/refresh_india_market.py
      - name: Reject stale or unqualified publication
        run: python scripts/refresh_india_market.py --validate public/data/market_snapshot.json
      - name: Publish qualified market files only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/data/market_snapshot.json public/data/mutual_fund_snapshot.json public/data/market_source_health.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(market): refresh qualified India daily data [skip ci]"
          git push origin HEAD:main
      - name: Retain source and validation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-publication-${{ github.run_id }}
          path: |
            public/data/market_snapshot.json
            public/data/mutual_fund_snapshot.json
            public/data/market_source_health.json
            public/data/market_refresh_attempt.json
          retention-days: 7
          if-no-files-found: warn
