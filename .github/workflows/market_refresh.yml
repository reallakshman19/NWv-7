name: Market Publisher Regression - NO DATA PUBLICATION

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/market_refresh.yml'
      - 'scripts/refresh_india_market.py'
      - 'scripts/test_refresh_india_market.py'
      - 'scripts/test_market_free_open_only.mjs'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Legacy publisher regressions - NO live source calls
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4 pytest
          python -m pytest -q scripts/test_refresh_india_market.py
      - name: Free/open public asset and disabled scheduling contract
        run: node --test scripts/test_market_free_open_only.mjs

# Intentionally no schedule, network acquisition, git commit, git push,
# public snapshot artifact upload, or production deployment job.
# Free/open-only public use never republishes Yahoo/NSE/BSE/AMFI bulk prices.
