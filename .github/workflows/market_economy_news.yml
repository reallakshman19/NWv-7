name: Market Economy News Refresh

on:
  schedule:
    - cron: '39 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-economy-news-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
      - name: Refresh and validate official headlines
        run: |
          python -m unittest discover -s scripts -p 'test_market_economy_news.py'
          python scripts/refresh_market_economy_news.py
          node scripts/check_market_publication_assets.mjs public
      - name: Publish the validated headline feed
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/data/market_economy_news.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh Market economy headlines'
          git push origin HEAD:main
