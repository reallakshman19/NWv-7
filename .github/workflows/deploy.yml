# Deploy to GitHub Pages

name: Deploy to GitHub Pages

on:
  # Do not publish a code push until its CI Validation Gate completes successfully.
  # Manual workflow_dispatch is an explicitly operator-triggered recovery path.
  workflow_dispatch:
  # Data-refresh workflows commit as github-actions[bot] via GITHUB_TOKEN, and
  # GITHUB_TOKEN pushes do NOT raise `push` events (GitHub's recursion guard) —
  # so `push` above never fires for data commits and the published site goes
  # stale. `workflow_run` DOES fire on workflow completion regardless of how the
  # upstream run was triggered, so this is what actually keeps Pages fresh.
  workflow_run:
    workflows:
      - "CI Validation Gate"
      - "News Prefetch"
      - "Market Refresh"
      - "Weather Refresh"
      - "UpAhead Refresh"
      - "Daily News Brief"
      - "Breaking Refresh"
      - "Travel local news prefetch"
    types: [completed]
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      source_sha: ${{ steps.checkout.outputs.source_sha }}
    # Publish only after a successful upstream CI or data run; manual dispatch
    # remains an explicit operator action (tracked by deployment provenance).
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Resolve deployment checkout authority
        id: source
        shell: bash
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          UPSTREAM_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
          UPSTREAM_WORKFLOW_NAME: ${{ github.event.workflow_run.name || '' }}
          UPSTREAM_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name || '' }}
          CURRENT_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          event_sha="${EVENT_SHA,,}"
          upstream_head_sha="${UPSTREAM_HEAD_SHA,,}"
          case "$TRIGGER_EVENT" in
            workflow_run)
              if [[ ! "$upstream_head_sha" =~ ^[0-9a-f]{40}$ ]]; then
                echo "Invalid workflow_run antecedent head SHA" >&2
                exit 1
              fi
              if [ -z "$DEFAULT_BRANCH" ]; then
                echo "Repository default branch is unavailable" >&2
                exit 1
              fi
              if [ "$UPSTREAM_WORKFLOW_NAME" = "CI Validation Gate" ]; then
                if [ "$UPSTREAM_HEAD_BRANCH" != "$DEFAULT_BRANCH" ] || \
                   [ "$UPSTREAM_REPOSITORY" != "$CURRENT_REPOSITORY" ]; then
                  echo "Refusing CI release from a non-default branch or external repository" >&2
                  exit 1
                fi
                # A CI-approved release must build exactly the tested source.
                checkout_ref="$upstream_head_sha"
                expected_source_sha="$upstream_head_sha"
                source_resolution_mode="workflow-run-ci-verified-sha"
              else
                # Data-refresh jobs may write new commits during execution;
                # retain their documented latest-main source resolution.
                checkout_ref="$DEFAULT_BRANCH"
                expected_source_sha=""
                source_resolution_mode="workflow-run-default-branch-checkout"
              fi
              ;;
            push)
              if [[ ! "$event_sha" =~ ^[0-9a-f]{40}$ ]]; then
                echo "Invalid push event SHA" >&2
                exit 1
              fi
              checkout_ref="$event_sha"
              expected_source_sha="$event_sha"
              source_resolution_mode="push-event-sha"
              ;;
            workflow_dispatch)
              if [[ ! "$event_sha" =~ ^[0-9a-f]{40}$ ]]; then
                echo "Invalid workflow_dispatch event SHA" >&2
                exit 1
              fi
              checkout_ref="$event_sha"
              expected_source_sha="$event_sha"
              source_resolution_mode="workflow-dispatch-event-sha"
              ;;
            *)
              echo "Unsupported deployment trigger: $TRIGGER_EVENT" >&2
              exit 1
              ;;
          esac
          echo "checkout_ref=$checkout_ref" >> "$GITHUB_OUTPUT"
          echo "default_branch=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
          echo "expected_source_sha=$expected_source_sha" >> "$GITHUB_OUTPUT"
          echo "source_resolution_mode=$source_resolution_mode" >> "$GITHUB_OUTPUT"

      - name: Checkout deployment source once
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.checkout_ref }}
          fetch-depth: 1

      - name: Freeze immutable checkout source
        id: checkout
        shell: bash
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          EXPECTED_SOURCE_SHA: ${{ steps.source.outputs.expected_source_sha }}
        run: |
          set -euo pipefail
          checked_out_sha=$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')
          if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid checked-out source SHA" >&2
            exit 1
          fi
          if [ -n "$EXPECTED_SOURCE_SHA" ] && \
             [ "$checked_out_sha" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "Checkout mismatch: expected $EXPECTED_SOURCE_SHA, observed $checked_out_sha" >&2
            exit 1
          fi
          echo "source_sha=$checked_out_sha" >> "$GITHUB_OUTPUT"
          echo "checked_out_sha=$checked_out_sha" >> "$GITHUB_OUTPUT"

      - name: Freeze build provenance timestamp
        id: clock
        shell: bash
        run: echo "frozen_at=$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}
          VITE_SECTIONS_AUTHORITY: cloudflare
          VITE_SECTIONS_AUTHORITY_URL: https://nw-sections-shadow.reallaksh19.workers.dev/preview/sections/latest
          VITE_SECTIONS_CLOUDFLARE_PREVIEW_URL: https://nw-sections-shadow.reallaksh19.workers.dev/preview/sections/latest
        run: npm run build

      - name: Reject superseded CI release source
        if: ${{ steps.source.outputs.source_resolution_mode == 'workflow-run-ci-verified-sha' }}
        env:
          DEFAULT_BRANCH: ${{ steps.source.outputs.default_branch }}
          APPROVED_SHA: ${{ steps.checkout.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          current_main_sha="$(git ls-remote origin "refs/heads/$DEFAULT_BRANCH" | cut -f1)"
          if [[ ! "$current_main_sha" =~ ^[0-9a-f]{40}$ ]] || \
             [ "$current_main_sha" != "$APPROVED_SHA" ]; then
            echo "CI-approved SHA is no longer the current main: verified=$APPROVED_SHA current=$current_main_sha" >&2
            exit 1
          fi

      - name: Install Chromium for prepublication World health
        run: npx playwright install --with-deps chromium

      - name: Check built Pages World health before publication
        shell: bash
        env:
          DEPLOYED_BASE_URL: https://reallakshman19.github.io/NWv-7/
          PREFLIGHT_ASSET_ORIGIN: http://127.0.0.1:4173/
          SMOKE_ARTIFACT_DIR: artifacts/world-health-prepublish
        run: |
          set -euo pipefail
          ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/nwv-pages-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ -o /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            cat /tmp/nwv-pages-preview.log
            echo 'Built Pages preview server did not become ready' >&2
            exit 1
          fi
          node scripts/verify_world_health_deployment.mjs

      - name: Upload prepublication World health evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-health-prepublish-${{ github.run_id }}
          path: artifacts/world-health-prepublish
          if-no-files-found: warn
          retention-days: 14

      - name: Write pages data manifest
        env:
          PAGES_EVENT_SHA: ${{ github.sha }}
          PAGES_SOURCE_SHA: ${{ steps.checkout.outputs.source_sha }}
          PAGES_CHECKED_OUT_SHA: ${{ steps.checkout.outputs.checked_out_sha }}
          PAGES_SOURCE_RESOLUTION_MODE: ${{ steps.source.outputs.source_resolution_mode }}
          PAGES_TRIGGER_EVENT: ${{ github.event_name }}
          PAGES_DEPLOY_WORKFLOW_RUN_ID: ${{ github.run_id }}
          PAGES_DEPLOY_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          PAGES_FROZEN_AT: ${{ steps.clock.outputs.frozen_at }}
          PAGES_UPSTREAM_WORKFLOW_NAME: ${{ github.event.workflow_run.name || '' }}
          PAGES_UPSTREAM_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          PAGES_UPSTREAM_WORKFLOW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || '' }}
          PAGES_UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          PAGES_UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
        run: node scripts/write_pages_data_manifest.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-pages-provenance:
    name: Verify deployed Pages source provenance
    runs-on: ubuntu-latest
    needs: [build, deploy]
    timeout-minutes: 10
    steps:
      - name: Checkout immutable verification source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Verify deployed Pages provenance and bytes
        env:
          DEPLOYED_BASE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          PAGES_PROVENANCE_ARTIFACT_DIR: artifacts/pages-deployment-provenance
        run: node scripts/verify_pages_deployment_provenance.mjs

      - name: Upload Pages provenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-deployment-provenance-${{ needs.build.outputs.source_sha }}-${{ github.run_id }}
          path: artifacts/pages-deployment-provenance
          if-no-files-found: error
          retention-days: 30

      - name: Publish Pages provenance status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_JOB_STATUS: ${{ job.status }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state="failure"
          description="Pages deployment provenance verification failed"
          if [ "$VERIFY_JOB_STATUS" = "success" ]; then
            state="success"
            description="Pages source checkout and served bytes verified"
          fi
          payload=$(jq -n \
            --arg state "$state" \
            --arg context "deployment/pages-provenance" \
            --arg description "$description" \
            --arg target_url "$RUN_URL" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')
          curl --fail-with-body \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" \
            --data "$payload"

  verify-world-health:
    name: Verify deployed World section health
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify World health badge and diagnostics
        env:
          DEPLOYED_BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/verify_world_health_deployment.mjs

      - name: Upload World health verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-health-deployment-verification
          path: artifacts/world-health-deployment
          if-no-files-found: warn
          retention-days: 30

      - name: Publish World health verification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_JOB_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state="failure"
          description="World health deployment verification failed"
          if [ "$VERIFY_JOB_STATUS" = "success" ]; then
            state="success"
            description="World health badge and source diagnostics verified"
          fi
          payload=$(jq -n \
            --arg state "$state" \
            --arg context "deployment/world-health" \
            --arg description "$description" \
            --arg target_url "$RUN_URL" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')
          curl --fail-with-body \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "$payload"
