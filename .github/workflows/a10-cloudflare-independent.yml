name: A10 public Cloudflare freshness and corrected UI — independent gate
on:
  push:
    branches: [fix/a10-provenance-consistency-r2-20261117]
permissions:
  contents: read
jobs:
  cloudflare-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node audit/evidence/a10_cloudflare_live_candidate_replay.mjs --require-cloudflare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a10-real-cloudflare-raw-epoch-candidate-chromium
          path: artifacts/a10-fix/
          if-no-files-found: error
          retention-days: 30
